<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Request Sender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">

<main class="w-full max-w-xl bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
    <div class="bg-gradient-to-r from-indigo-600 to-violet-600 p-6 text-white">
        <h1 class="text-2xl font-bold tracking-tight">OTP Request Controller</h1>
        <p class="text-indigo-100 text-sm mt-1">Configure your target mobile number and batch count to dispatch requests.</p>
    </div>

    <div class="p-6 sm:p-8 space-y-6">
        <form id="otpForm" class="space-y-4" onsubmit="event.preventDefault(); startSending();">
            <div>
                <label for="mobileInput" class="block text-sm font-medium text-slate-700 mb-1">Mobile Number</label>
                <input type="tel" id="mobileInput" required pattern="[0-9]{10}"
                    placeholder="e.g. 9999999999"
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                <p class="text-xs text-slate-500 mt-1">Enter a 10-digit mobile number.</p>
            </div>

            <div>
                <label for="countInput" class="block text-sm font-medium text-slate-700 mb-1">Number of Iterations</label>
                <input type="number" id="countInput" required min="1" max="500" value="10"
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all">
                <p class="text-xs text-slate-500 mt-1">Total requests to send.</p>
            </div>

            <div class="flex items-center gap-4 pt-2">
                <button type="submit" id="startBtn"
                    class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                    Start Sending
                </button>

                <button type="button" id="stopBtn" disabled onclick="stopSending()"
                    class="bg-slate-200 text-slate-400 font-medium py-3 px-6 rounded-xl cursor-not-allowed transition-all">
                    Stop
                </button>
            </div>
        </form>

        <div class="space-y-3 pt-4 border-t border-slate-100">
            <div class="flex items-center justify-between text-sm">
                <span class="font-medium text-slate-700">Live Status & Logs</span>
                <span id="progressText" class="text-slate-500">Idle</span>
            </div>

            <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                <div id="progressBar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <div id="logBox" class="bg-slate-900 text-slate-200 font-mono text-xs rounded-xl p-4 h-48 overflow-y-auto space-y-1.5 shadow-inner">
                <div class="text-slate-500">// Logs will appear here once started...</div>
            </div>
        </div>
    </div>
</main>

<script>
let isRunning = false;
let shouldStop = false;

function logMessage(message, type = 'info') {
    const logBox = document.getElementById('logBox');
    const timestamp = new Date().toLocaleTimeString();
    const div = document.createElement('div');

    let colorClass = 'text-slate-300';
    if (type === 'success') colorClass = 'text-emerald-400';
    if (type === 'error') colorClass = 'text-rose-400';
    if (type === 'warn') colorClass = 'text-amber-400';

    div.className = `${colorClass} flex items-start gap-2`;
    div.innerHTML = `<span class="text-slate-500 select-none">[${timestamp}]</span>
                     <span class="break-all">${message}</span>`;

    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
}

function stopSending() {
    if (isRunning) {
        shouldStop = true;
        logMessage('Stop signal sent by user. Waiting for current request...', 'warn');
    }
}

async function startSending() {
    const mobile = document.getElementById('mobileInput').value.trim();
    const totalCount = parseInt(document.getElementById('countInput').value, 10);

    if (!/^[0-9]{10}$/.test(mobile)) {
        logMessage('Please enter a valid 10-digit mobile number.', 'error');
        return;
    }

    if (isNaN(totalCount) || totalCount < 1 || totalCount > 500) {
        logMessage('Please enter an iteration count between 1 and 500.', 'error');
        return;
    }

    isRunning = true;
    shouldStop = false;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const logBox = document.getElementById('logBox');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    startBtn.disabled = true;
    startBtn.className = 'flex-1 bg-indigo-400 text-white font-medium py-3 px-6 rounded-xl cursor-not-allowed flex items-center justify-center gap-2';

    stopBtn.disabled = false;
    stopBtn.className = 'bg-rose-600 hover:bg-rose-700 text-white font-medium py-3 px-6 rounded-xl shadow-md cursor-pointer';

    logBox.innerHTML = '';
    progressBar.style.width = '0%';
    progressText.innerText = 'Starting...';

    logMessage(`Starting execution batch for ${mobile}. Total requests: ${totalCount}`);

    let successCount = 0;
    let failCount = 0;

    for (let i = 1; i <= totalCount; i++) {
        if (shouldStop) {
            logMessage('Execution gracefully halted by user.', 'warn');
            break;
        }

        const percent = Math.round((i / totalCount) * 100);
        progressBar.style.width = `${percent}%`;
        progressText.innerText = `Request ${i} of ${totalCount} (${percent}%)`;

        try {
            const response = await fetch('https://krishivikas.com/api/v3/otp-send', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ mobile })
            });

            let data;
            try {
                data = await response.json();
            } catch {
                data = { message: await response.text() };
            }

            if (response.ok) {
                successCount++;
                logMessage(`Request ${i} success (Status: ${response.status})`, 'success');
            } else {
                failCount++;
                logMessage(
                    `Request ${i} responded with status ${response.status}: ${JSON.stringify(data)}`,
                    'error'
                );
            }
        } catch (error) {
            failCount++;
            logMessage(`Request ${i} failed: ${error.message}`, 'error');
        }

        if (i < totalCount && !shouldStop) {
            await new Promise(resolve => setTimeout(resolve, 1000));
        }
    }

    isRunning = false;
    startBtn.disabled = false;
    startBtn.className = 'flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2';

    stopBtn.disabled = true;
    stopBtn.className = 'bg-slate-200 text-slate-400 font-medium py-3 px-6 rounded-xl cursor-not-allowed transition-all';

    progressText.innerText = `Finished (Success: ${successCount}, Failed: ${failCount})`;
    logMessage(`Batch complete. Total Success: ${successCount}, Total Failed: ${failCount}`);
}
</script>

</body>
</html>
